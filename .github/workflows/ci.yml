---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint-and-syntax:
    name: ansible-lint and syntax-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible toolchain
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Create inventory and vault files for CI
        run: |
          echo 'homelab' > .vault_pass
          chmod 600 .vault_pass
          cp inventory.ini.example inventory.ini
          cp group_vars/all/vault.yml.example group_vars/all/vault.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Syntax-check classroom and capstone playbooks
        run: |
          ansible-playbook 01-basics.yml --syntax-check
          ansible-playbook 02-webserver.yml --syntax-check
          ansible-playbook site.yml --syntax-check
          ansible-playbook playbooks/rolling-deploy.yml --syntax-check
          ansible-playbook playbooks/backup-now.yml --syntax-check
          ansible-playbook playbooks/check-health.yml --syntax-check

  molecule:
    name: molecule nginx and postgres
    runs-on: ubuntu-latest
    needs: lint-and-syntax
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Molecule and Ansible
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Test nginx role
        run: molecule test
        working-directory: roles/nginx

      - name: Test postgres role
        run: molecule test
        working-directory: roles/postgres
