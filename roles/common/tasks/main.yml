---
- name: Set system timezone
  community.general.timezone:
    name: "{{ common_timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Enable unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
      APT::Periodic::AutocleanInterval "7";
  when: common_unattended_upgrades | bool

- name: Apply sysctl hardening
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop: "{{ common_sysctl | dict2items }}"
  when: common_sysctl_hardening | bool

- name: Configure sshd hardening
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: "/usr/sbin/sshd -t -f %s"
  loop:
    - { regexp: "^#?PermitRootLogin", line: "PermitRootLogin {{ common_ssh_permit_root_login }}" }
    - { regexp: "^#?PasswordAuthentication", line: "PasswordAuthentication {{ 'yes' if common_ssh_password_authentication | bool else 'no' }}" }
    - { regexp: "^#?X11Forwarding", line: "X11Forwarding no" }
    - { regexp: "^#?MaxAuthTries", line: "MaxAuthTries 4" }
    - { regexp: "^#?AllowTcpForwarding", line: "AllowTcpForwarding no" }
  notify: Restart sshd

- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
  when: common_fail2ban_enabled | bool

- name: Deploy fail2ban ssh jail
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [sshd]
      enabled = true
      port = ssh
      maxretry = 5
      bantime = 1h
  when: common_fail2ban_enabled | bool
  notify: Restart fail2ban

- name: Reset UFW to deny incoming by default
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
  when: common_ufw_enabled | bool

- name: Allow SSH through UFW
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
  when:
    - common_ufw_enabled | bool
    - common_ufw_allow_ssh | bool

- name: Allow role-specific ports through UFW
  community.general.ufw:
    rule: allow
    port: "{{ item.port }}"
    proto: "{{ item.proto | default('tcp') }}"
    src: "{{ item.src | default('any') }}"
  loop: "{{ ufw_extra_ports | default([]) }}"
  when: common_ufw_enabled | bool
