---
- name: Install application runtime packages
  ansible.builtin.apt:
    name:
      - python3
      - python3-venv
      - python3-pip
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create application group
  ansible.builtin.group:
    name: "{{ app_group }}"
    state: present

- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ app_home }}"
    create_home: false

- name: Create application directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"
  loop:
    - "{{ app_home }}"
    - "{{ app_home }}/app"

- name: Sync application source
  ansible.builtin.copy:
    src: homelab-api/
    dest: "{{ app_home }}/app/"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  notify: Restart homelab-api

- name: Create Python virtualenv
  ansible.builtin.command:
    cmd: "{{ app_python }} -m venv {{ app_venv }}"
    creates: "{{ app_venv }}/bin/python"

- name: Install application Python dependencies
  ansible.builtin.pip:
    requirements: "{{ app_home }}/app/requirements.txt"
    virtualenv: "{{ app_venv }}"
  notify: Restart homelab-api

- name: Deploy application environment file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_home }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0640"
  notify: Restart homelab-api

- name: Deploy systemd unit
  ansible.builtin.template:
    src: homelab-api.service.j2
    dest: "/etc/systemd/system/{{ app_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  notify: Restart homelab-api

- name: Enable and start application service
  ansible.builtin.systemd:
    name: "{{ app_service_name }}"
    state: started
    enabled: true
    daemon_reload: true
