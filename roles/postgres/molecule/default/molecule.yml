---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
driver:
  name: docker
platforms:
  - name: postgres-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        lab_mode: true
        project_timezone: UTC
        homelab_app_ip: 127.0.0.1
        db_name: homelab
        db_user: homelab
        db_port: 5432
        db_listen_addresses: "127.0.0.1"
        postgres_listen_addresses: "127.0.0.1"
        postgres_app_allowed_cidr: 127.0.0.1/32
        postgres_locale: C.UTF-8
        vault_db_password: molecule-db-password
verifier:
  name: ansible
