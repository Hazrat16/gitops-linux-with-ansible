---
dependency:
  name: galaxy
  options:
    requirements-file: ../../../requirements.yml
driver:
  name: docker
platforms:
  - name: nginx-instance
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        lab_mode: true
        project_timezone: UTC
        homelab_web_ip: 127.0.0.1
        homelab_app_ip: 127.0.0.1
        app_upstream: 127.0.0.1
        app_port: 8000
        app_health_path: /health
        nginx_server_name: homelab.local
        tls_provider: selfsigned
        tls_cert_dir: /etc/nginx/ssl
        tls_cert_path: /etc/nginx/ssl/homelab.local.crt
        tls_key_path: /etc/nginx/ssl/homelab.local.key
verifier:
  name: ansible
