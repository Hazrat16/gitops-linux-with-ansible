---
- name: Ensure nginx is running before certbot HTTP-01
  ansible.builtin.service:
    name: nginx
    state: started

- name: Request or renew Let's Encrypt certificate
  ansible.builtin.command:
    cmd: >
      certbot --nginx --non-interactive --agree-tos
      --email {{ letsencrypt_email }}
      -d {{ nginx_server_name }}
      --redirect
  register: nginx_certbot_result
  changed_when: "'Certificate not yet due for renewal' not in nginx_certbot_result.stdout"
  notify: Reload nginx
