---
- name: Check platform health through the reverse proxy
  hosts: web
  gather_facts: false
  become: false
  run_once: true
  tasks:
    - name: Probe reverse-proxy health endpoint
      ansible.builtin.uri:
        url: "https://{{ nginx_health_host }}{{ app_health_path }}"
        method: GET
        validate_certs: false
        status_code: 200
      delegate_to: localhost
      register: health
      retries: 5
      delay: 2
      until: health.status | default(0) == 200

    - name: Show health payload
      ansible.builtin.debug:
        var: health.json
